spring:

  application:
    name: nearlog-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nearlog}
    username: ${DB_USERNAME:nearlog}
    password: ${DB_PASSWORD:nearlog}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer: nearlog

    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}

    access-expiration: 15m
    refresh-expiration: 14d

  auth:
    cookie-secure: ${COOKIE_SECURE:false}